name: Probar Firebase

# Prueba amigos y clasificaciones contra el Firebase real con jugadores de prueba (se borran al terminar).
# Antes publica reglas e índices si existe el secreto FIREBASE_SERVICE_ACCOUNT.
on:
  push:
    branches: [main]
    paths: ['src/social.js', 'tools/firebase_live.mjs', 'tools/socialflow.py', '.github/workflows/firebase-test.yml']
  workflow_dispatch:
    inputs:
      db:
        description: 'Base de datos de Firestore'
        default: '(default)'

# Base de datos a probar: (default) salvo que se elija otra al lanzarlo a mano
env:
  FS_DB: ${{ github.event.inputs.db || '(default)' }}

permissions:
  contents: write     # para dejar los resultados en la rama resultados-pruebas

jobs:
  probar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: mkdir -p res
      - name: Publicar reglas e índices
        shell: bash
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then echo "Sin secreto FIREBASE_SERVICE_ACCOUNT: se prueban las reglas que haya en la consola"; exit 0; fi
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          set -o pipefail
          # índices por la API de Firestore (basta el rol de índices); reglas con firebase-tools (necesita el rol de reglas)
          ok=0
          gcloud auth activate-service-account --key-file="$RUNNER_TEMP/sa.json" -q > /dev/null 2>&1
          python3 tools/deploy_indexes.py "$(gcloud auth print-access-token)" 2>&1 | tee res/deploy.txt || ok=1
          python3 tools/clean_test_users.py "$(gcloud auth print-access-token)" 2>&1 | tee -a res/deploy.txt
          npx --yes firebase-tools@14 deploy --only firestore:rules --project rocket-rush-7297c --non-interactive --force 2>&1 | tee -a res/deploy.txt || ok=1
          exit $ok
      - name: Bases de datos del proyecto (diagnóstico)
        if: always()
        shell: bash
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          [ -z "$SA" ] && exit 0
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          { echo "cuenta de servicio: $(python3 -c "import json;print(json.load(open('$RUNNER_TEMP/sa.json'))['client_email'])")"
            gcloud auth activate-service-account --key-file="$RUNNER_TEMP/sa.json" -q 2>&1 | tail -1
            TOK=$(gcloud auth print-access-token)
            echo "--- bases de datos Firestore:"
            curl -s -H "Authorization: Bearer $TOK" https://firestore.googleapis.com/v1/projects/rocket-rush-7297c/databases | python3 -c "import json,sys;j=json.load(sys.stdin);print(json.dumps(j.get('error') or [{k:d.get(k) for k in ('name','locationId','type','concurrencyMode')} for d in j.get('databases',[])],indent=1))"
            echo "--- permisos de la cuenta de servicio (roles):"
            gcloud projects get-iam-policy rocket-rush-7297c --flatten=bindings[].members --filter="bindings.members:$(python3 -c "import json;print(json.load(open('$RUNNER_TEMP/sa.json'))['client_email'])")" --format='value(bindings.role)' 2>&1 | head -20
          } 2>&1 | tee res/diagnostico.txt
          rm -f "$RUNNER_TEMP/sa.json"
      - name: Reglas y servidor (API directa)
        if: always()
        shell: bash
        run: set -o pipefail; node tools/firebase_live.mjs 2>&1 | tee res/api.txt
      - name: El juego de verdad en el navegador (dos jugadores)
        if: always()
        shell: bash
        run: |
          set -o pipefail
          node tools/build.js
          pip install --quiet playwright
          python -m playwright install --with-deps chromium > /dev/null
          nohup python -m http.server 8123 > /dev/null 2>&1 &
          for i in $(seq 1 40); do curl -s -o /dev/null http://localhost:8123/dist/index.html && break; sleep 0.5; done
          LIVE=1 GAME_URL=http://localhost:8123/dist/index.html python -u tools/socialflow.py 2>&1 | tee res/juego.txt
      - name: Guardar resultados en la rama resultados-pruebas
        if: always()
        run: |
          cp dist/shots/soc_*.png res/ 2>/dev/null || true
          git config user.name "github-actions"; git config user.email "actions@users.noreply.github.com"
          mv res /tmp/res
          git checkout -q --orphan resultados-pruebas
          git rm -rfq . ; git clean -fdq
          cp -r /tmp/res/. .
          git add -A; git commit -qm "Resultados de la prueba de Firebase (${GITHUB_SHA::7})"
          git push -qf origin resultados-pruebas
