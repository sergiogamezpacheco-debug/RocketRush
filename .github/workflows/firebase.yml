name: Publicar reglas de Firebase

# Sube las reglas y los índices de Firestore cuando cambian (o a mano desde la pestaña Actions).
# Necesita el secreto FIREBASE_SERVICE_ACCOUNT (el .json de la cuenta de servicio del proyecto); sin él no hace nada.
on:
  push:
    branches: [main]
    paths: ['firebase/**', 'firebase.json']
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Publicar reglas e índices
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then echo "Falta el secreto FIREBASE_SERVICE_ACCOUNT: no se publica nada"; exit 0; fi
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          # índices por la API de Firestore (basta el rol de índices); reglas con firebase-tools (necesita el rol de reglas)
          ok=0
          gcloud auth activate-service-account --key-file="$RUNNER_TEMP/sa.json" -q > /dev/null 2>&1
          python3 tools/deploy_indexes.py "$(gcloud auth print-access-token)" || ok=1
          # sin el rol «Administrador de Firebase Rules» no se pueden publicar: aviso, no error (se pegan a mano en la consola)
          npx --yes firebase-tools@14 deploy --only firestore:rules --project rocket-rush-7297c --non-interactive --force || echo "::warning::No se han publicado las reglas: falta el rol Administrador de Firebase Rules (pégalas a mano si cambian)"
          exit $ok
