name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Empaquetar el juego
        env:
          APP_VERSION: 1.0.${{ github.run_number }}
        run: |
          node tools/build.js
          mkdir -p android/app/src/main/assets
          cp dist/index.html android/app/src/main/assets/index.html

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # El SDK de Android ya viene instalado en las máquinas de GitHub: solo se aceptan sus licencias
      - name: Preparar el SDK de Android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK de prueba
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: RocketRush-1.0.${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/*.apk
