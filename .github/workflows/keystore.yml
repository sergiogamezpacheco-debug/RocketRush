name: Crear clave de subida

# Se lanza UNA sola vez, a mano. Crea la clave con la que se firman los paquetes que se suben a Google Play
# y la guarda directamente en los secretos del repositorio (no sale en ningún registro ni en el chat).
# Necesita dos secretos que creas tú en GitHub › Settings › Secrets and variables › Actions:
#   GH_ADMIN_TOKEN  token de GitHub (fine-grained) solo para este repositorio con permiso «Secrets: Read and write»
#   KEY_BACKUP_PASS una contraseña que elijas tú (apúntala): cifra la copia de seguridad de la clave
# La copia (zip cifrado con KEY_BACKUP_PASS, con la clave y sus contraseñas dentro) queda 3 días como artefacto
# de la ejecución: descárgala y guárdala en un sitio seguro. Si se perdiera, Google permite cambiar la clave de subida.
on:
  workflow_dispatch:
    inputs:
      confirmar:
        description: 'Escribe CREAR para generar la clave (si ya existe, se sustituye)'
        required: true

jobs:
  clave:
    runs-on: ubuntu-24.04
    if: ${{ github.event.inputs.confirmar == 'CREAR' }}
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Generar la clave y guardarla en los secretos
        env:
          GH_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
          BACKUP: ${{ secrets.KEY_BACKUP_PASS }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          if [ -z "$GH_TOKEN" ]; then echo "::error::Falta el secreto GH_ADMIN_TOKEN"; exit 1; fi
          if [ -z "$BACKUP" ]; then echo "::error::Falta el secreto KEY_BACKUP_PASS"; exit 1; fi
          PASS=$(openssl rand -base64 30 | tr -dc 'A-Za-z0-9' | head -c 28)
          echo "::add-mask::$PASS"
          cd "$RUNNER_TEMP"
          keytool -genkeypair -v -keystore subida.jks -storetype JKS -alias subida -keyalg RSA -keysize 4096 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" -dname "CN=Sergio Gamez Pacheco, O=Lost Anarchy Games, C=ES" > /dev/null 2>&1
          base64 -w0 subida.jks | gh secret set UPLOAD_KEYSTORE_B64 -R "$REPO"
          printf '%s' "$PASS" | gh secret set UPLOAD_KEYSTORE_PASS -R "$REPO"
          printf '%s' "$PASS" | gh secret set UPLOAD_KEY_PASS -R "$REPO"
          printf 'subida' | gh secret set UPLOAD_KEY_ALIAS -R "$REPO"
          keytool -list -v -keystore subida.jks -storepass "$PASS" | grep -E "SHA1:|SHA256:" || true
          printf 'Clave de subida de Rocket Rush\nArchivo: subida.jks\nAlias: subida\nContrasena del almacen y de la clave: %s\n' "$PASS" > LEEME.txt
          zip -q -P "$BACKUP" clave-subida.zip subida.jks LEEME.txt
          rm -f subida.jks LEEME.txt
      - uses: actions/upload-artifact@v4
        with:
          name: clave-subida-cifrada
          path: ${{ runner.temp }}/clave-subida.zip
          retention-days: 3
