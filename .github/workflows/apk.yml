name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write     # para publicar en Releases

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Empaquetar el juego
        env:
          APP_VERSION: 1.0.${{ github.run_number }}
        run: |
          node tools/build.js --xm-pruebas    # Navidad adelantada solo en la app de pruebas
          mkdir -p android/app/src/main/assets
          cp dist/index.html android/app/src/main/assets/index.html

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # El SDK de Android ya viene instalado en las máquinas de GitHub: se aceptan sus licencias y se añade Android 16 (API 36)
      - name: Preparar el SDK de Android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      # App de pruebas («RR Pruebas»): se instala al lado de la de Google Play, con el modo prueba y anuncios de prueba
      - name: Compilar APK de prueba
        working-directory: android
        env:
          ADMOB_APP_ID: ${{ vars.ADMOB_APP_ID }}
          ADMOB_REWARDED: ${{ vars.ADMOB_REWARDED }}
          ADMOB_INTERSTITIAL: ${{ vars.ADMOB_INTERSTITIAL }}
        run: gradle assembleDebug --no-daemon --stacktrace

      # 23-11: se publica como Release (las Releases no cuentan para el límite de espacio de los archivos de Actions)
      - name: Publicar en Releases (APK de pruebas)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          V: 1.0.${{ github.run_number }}
        run: |
          f=$(ls android/app/build/outputs/apk/debug/*.apk | head -1)
          cp "$f" "RocketRush-Pruebas-$V.${f##*.}"
          gh release view apk-pruebas >/dev/null 2>&1 || gh release create apk-pruebas --target "$GITHUB_SHA" --prerelease --title "APK de pruebas" --notes "APK de pruebas (modo prueba, compras simuladas). Se instala en el móvil."
          gh release upload apk-pruebas "RocketRush-Pruebas-$V.${f##*.}" --clobber
          gh release edit apk-pruebas --title "APK de pruebas $V" --notes "APK de pruebas (modo prueba, compras simuladas). Se instala en el móvil. Última: $V."
          # se quedan solo las 3 últimas
          gh release view apk-pruebas --json assets --jq '.assets | sort_by(.createdAt) | reverse | .[3:] | .[].name' | while read -r a; do gh release delete-asset apk-pruebas "$a" -y; done
