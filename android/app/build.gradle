plugins {
    id 'com.android.application'
}

// Identificadores de AdMob de la versión de Google Play (cuenta pub-8884472900712050). Son públicos: van en el código.
// La app de pruebas («RR Pruebas», debug) usa siempre los de prueba de Google (más abajo), para no tocar anuncios reales.
// Se pueden cambiar sin tocar el código con variables de GitHub (ADMOB_APP_ID, ADMOB_REWARDED, ADMOB_INTERSTITIAL).
def env = { String k, String d -> def v = System.getenv(k); return (v != null && !v.trim().isEmpty()) ? v.trim() : d }
def admobApp = env('ADMOB_APP_ID', 'ca-app-pub-8884472900712050~3759414973')
def admobRewarded = env('ADMOB_REWARDED', 'ca-app-pub-8884472900712050/4414021099')
def admobInter = env('ADMOB_INTERSTITIAL', 'ca-app-pub-8884472900712050/9342914146')
// Clave de subida a Google Play (solo en GitHub, desde los secretos; nunca en el repositorio)
def upload = System.getenv('UPLOAD_KEYSTORE_FILE')

android {
    namespace 'com.lostanarchygames.rocketrush'
    compileSdk 36

    defaultConfig {
        applicationId "com.lostanarchygames.rocketrush"
        minSdk 24
        targetSdk 36
        // en GitHub Actions cada compilación lleva un número mayor (así el móvil la reconoce como actualización)
        versionCode 10 + (System.getenv("GITHUB_RUN_NUMBER") ?: "0").toInteger()
        versionName "1.0." + (System.getenv("GITHUB_RUN_NUMBER") ?: "0")
    }

    signingConfigs {
        // Clave fija para las APK de prueba: todas se firman igual y se instalan encima de la anterior.
        pruebas {
            storeFile file('rocketrush-test.jks')
            storePassword 'rocketrush'
            keyAlias 'rocketrush'
            keyPassword 'rocketrush'
        }
        if (upload) {
            subida {
                storeFile file(upload)
                storePassword System.getenv('UPLOAD_KEYSTORE_PASS')
                keyAlias System.getenv('UPLOAD_KEY_ALIAS')
                keyPassword System.getenv('UPLOAD_KEY_PASS')
            }
        }
    }

    buildTypes {
        // App de pruebas (la APK de cada cambio): se instala al lado de la de Google Play sin pisarla
        // (otro identificador y otro nombre e icono con la cinta PRUEBAS). Lleva el modo prueba y siempre
        // los anuncios de prueba de Google, para no tocar nunca los anuncios reales.
        debug {
            signingConfig signingConfigs.pruebas
            applicationIdSuffix '.pruebas'
            manifestPlaceholders = [admobAppId: 'ca-app-pub-3940256099942544~3347511713', appLabel: 'RR Pruebas']
            resValue 'string', 'admob_rewarded', 'ca-app-pub-3940256099942544/5224354917'
            resValue 'string', 'admob_interstitial', 'ca-app-pub-3940256099942544/1033173712'
        }
        release {
            minifyEnabled false
            if (upload) signingConfig signingConfigs.subida
            manifestPlaceholders = [admobAppId: admobApp, appLabel: 'Rocket Rush']
            resValue 'string', 'admob_rewarded', admobRewarded
            resValue 'string', 'admob_interstitial', admobInter
        }
    }

    buildFeatures { resValues true }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// nombre del archivo: RocketRush-1.0.N.apk
android.applicationVariants.all { variant ->
    variant.outputs.all { outputFileName = (variant.buildType.name == 'debug' ? "RocketRush-Pruebas-" : "RocketRush-") + "${variant.versionName}.apk" }
}

dependencies {
    // sirve el juego desde la APK con una dirección https (lo necesita Firebase)
    implementation 'androidx.webkit:webkit:1.12.1'
    // pantalla de borde a borde, gesto atrás predictivo e insets (muesca y barras)
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'androidx.core:core:1.13.1'
    // compras dentro del juego con Google Play
    implementation 'com.android.billingclient:billing:8.0.0'
    // anuncios (AdMob) y formulario de consentimiento (UMP)
    implementation 'com.google.android.gms:play-services-ads:24.0.0'
    implementation 'com.google.android.ump:user-messaging-platform:3.1.0'
    // entrar con Google (Credential Manager) para guardar el progreso en la nube
    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
}
